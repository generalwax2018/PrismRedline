version: "3.8"

services:
  kali:
    image: kalilinux/kali-rolling
    container_name: prismredline
    privileged: true
    network_mode: host
    volumes:
      - ./:/workspace
      - kali-data:/root
    command: >
      bash -c "
        apt update &&
        apt install -y python3 python3-pip nmap gobuster nikto sqlmap &&
        pip3 install -r /workspace/requirements.txt &&
        echo 'Kali container ready. Install Ollama on the host and run the agent from the host or inside the container.' &&
        tail -f /dev/null
      "
    restart: unless-stopped

volumes:
  kali-data:
